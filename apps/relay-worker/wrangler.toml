name = "farsight-relay"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Defaults for a self-hosted relay; treat them as a starting point, not a
# promise. Ciphertext lives in the Durable Object's own storage rather than
# an object store, so this Worker needs no paid Cloudflare service. See
# docs/RELAY_PROTOCOL.md for the contract this must satisfy.

[[durable_objects.bindings]]
name = "TOKENS"
class_name = "TokenObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TokenObject"]

# Per-IP upload throttle so an exposed relay can't be used as free
# anonymous encrypted blob storage. Downloads are intentionally not
# rate-limited here — burn-after-read and short TTLs already bound how much
# a given upload can be abused, and legitimate agents may retry a fetch.
[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
