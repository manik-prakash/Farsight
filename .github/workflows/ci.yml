name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Typechecking resolves @farsight/core through its exports map, which
      # points at ./dist -- so the workspaces have to be built first.
      - run: npm run build
      - run: npm run typecheck --workspaces --if-present
      - run: npm run test --workspaces --if-present
